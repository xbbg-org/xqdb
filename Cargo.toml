[workspace]
resolver = "2"
members = ["crates/*", "py-xqdb", "bindings/napi-xqdb"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.1"
authors = ["XQDB contributors"]
edition = "2021"
repository = "https://github.com/xbbg-org/xqdb"
license = "BSD-3-Clause"
description = "a backend-agnostic Python dataframe interface to q"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.node-release]
inherits = "release"
opt-level = 3
panic = "unwind"

[workspace.dependencies.polars-buffer]
default-features = false
version = "0.55.2"

[workspace.dependencies.polars-arrow]
default-features = false
version = "0.55.2"

[workspace.dependencies.polars]
version = "0.55.2"
