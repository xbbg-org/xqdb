[package]
name = "napi-xqdb"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for xqdb"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4.45"
indexmap = "2.14.0"
xqdb = { path = "../../crates/xqdb" }
napi = { version = "3.12.1", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3.6.3"
polars = { workspace = true, features = ["ipc", "ipc_streaming"] }
rustls-pki-types = "1"
uuid = "1.23.3"

[build-dependencies]
napi-build = "2.4.1"
