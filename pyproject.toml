[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "setuptools-scm==10.2.1", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xqdb"
description = "High-performance, backend-agnostic q IPC for Python and Node.js"
readme = { file = "py-xqdb/README.md", content-type = "text/markdown" }
authors = [{ name = "XQDB contributors" }]
license = "BSD-3-Clause"
license-files = ["py-xqdb/LICENSE"]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]
keywords = ["q", "kdb", "narwhals", "dataframe", "arrow"]
dynamic = ["version"]
dependencies = ["narwhals>=2.10.0", "pyarrow>=20.0.0"]

[dependency-groups]
dev = [
  "build>=1.3",
  "pytest>=8.4",
  "pandas>=2.2",
  "polars>=1.31.0",
  "patchelf; sys_platform == 'linux'",
]
# Exact pins keep benchmark runs comparable across machines and subjects.
# kola and qconnect are the benchmark competitors; requests is a qconnect
# dependency it fails to declare. PyKX is deliberately absent: its licence
# forbids publishing performance comparisons.
benchmark = [
  "polars==1.44.1",
  "pandas==3.0.5",
  "kola==2.5.1",
  "qconnect==0.1.6",
  "requests==2.34.2",
  "psutil==7.2.2",
]

[project.urls]
Repository = "https://github.com/xbbg-org/xqdb"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc|alpha|beta)\d+)?)$'

[tool.setuptools_scm.scm.git]
describe_command = 'git describe --dirty --tags --long --match "v[0-9]*"'

[[tool.setuptools-rust.ext-modules]]
target = "xqdb.xqdb"
path = "py-xqdb/Cargo.toml"
binding = "PyO3"

[tool.setuptools.packages.find]
where = ["py-xqdb"]
include = ["xqdb*"]
