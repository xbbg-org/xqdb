[workspace]
name = "xqdb"
description = "High-performance, backend-agnostic q IPC for Python and Node.js"
# Conda packages below resolve from conda-forge only (see `channels`).
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.71"

[dependencies]
# Provisions the cargo toolchain for the core crate and both bindings.
rust = ">=1.88"
# abi3-py310 wheels: 3.12 is the default dev interpreter, not a support floor.
python = ">=3.10,<3.15"
uv = ">=0.7"
pip = "*"

[activation.env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks]
test-rs = "cargo test"
lint-rs = "cargo clippy --workspace --all-targets -- -D warnings"
fmt-rs = "cargo fmt --all"
fmt-check-rs = "cargo fmt --all -- --check"
# Python dev flow mirrors xbbg: dependency groups come from the root project,
# and setuptools-rust performs a release-profile editable build.
venv = """python -c "from pathlib import Path; import subprocess; subprocess.run(['uv', 'venv', '--python', '3.12', '.venv'], check=True) if not Path('.venv/pyvenv.cfg').is_file() else None" && uv pip install --python .venv --group dev --group benchmark"""
build-python = { cmd = "uv pip install --python .venv --reinstall -e .", env = { SETUPTOOLS_RUST_CARGO_PROFILE = "release" } }
test-python = "uv run --no-project --python .venv pytest -q py-xqdb/test"
benchmark-python = "uv run --no-project --python .venv python py-xqdb/benchmarks/bench_ipc.py"

# ── Features ──────────────────────────────────────────────────────────────────

[feature.js.dependencies]
nodejs = ">=22"

[feature.js.tasks]
js-install = { cmd = "npm install --no-audit --no-fund", cwd = "js-xqdb" }
js-build = { cmd = "npm run build:release", cwd = "js-xqdb" }
js-test = { cmd = "npm test", cwd = "js-xqdb" }
js-test-live = { cmd = "npm run test:live", cwd = "js-xqdb" }
js-benchmark = { cmd = "npm run benchmark", cwd = "js-xqdb" }

# ── Environments ──────────────────────────────────────────────────────────────

[environments]
default = { solve-group = "main" }
js = { features = ["js"], solve-group = "main" }
